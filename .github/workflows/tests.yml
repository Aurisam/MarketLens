# Testai naudoja laikiną SQLite ir imituotus API; produkcinės DB paslapčių nereikia.
name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DJANGO_DEBUG: "true"
      DATABASE_URL: ""
      DATABASE_URL_UNPOOLED: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pip install -r requirements.txt
      - name: Check Django and migration files
        run: |
          python config/manage.py check
          python config/manage.py makemigrations --check --dry-run
      - name: Test backend calculations and data handling
        run: python config/manage.py test dashboard
      - name: Test browser logic with simulated events
        run: |
          node tests/prices.test.mjs
          node tests/dashboard.test.mjs
          node tests/charts.test.mjs
      - name: Check static file collection
        run: python config/manage.py collectstatic --noinput
